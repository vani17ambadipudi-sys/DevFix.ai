name: DevFix AI Production CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Build, Lint, & Test Automation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies for Transformer Lab
        run: |
          python3 -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu numpy matplotlib

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Type Checking & Linting
        run: npm run lint

      - name: Run Production Test Automation Suite (Unit & Integration)
        run: npm test

      - name: Compile & Build Application
        run: npm run build
