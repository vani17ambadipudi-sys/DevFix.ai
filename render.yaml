# ==============================================================================
# DevFix AI Platform — Render Blueprint Infrastructure Specification
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  - type: web
    name: devfix-ai-platform
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
